<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9eee1"><title>Little Elsewhere · travel diary</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT@9..144,500,30;9..144,650,30&display=swap" rel="stylesheet"><style>
:root{--bg:#f7f6ee;--paper:#fffdf8;--ink:#344638;--muted:#7d8979;--sage:#789579;--soft:#e8eee3;--line:#e3e6da;--peach:#f5e5d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Fraunces,Georgia,serif}header{max-width:960px;margin:auto;padding:22px 22px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Fraunces,serif;font-size:22px;font-weight:650;letter-spacing:-.7px}.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:42px;height:42px;font-size:20px;color:var(--ink)}main{max-width:960px;margin:auto;padding:0 18px 100px}.hero{background:#dfe8d8;border-radius:28px;padding:28px 24px;margin:16px 0 24px;position:relative;overflow:hidden;min-height:188px}.hero:after{content:'✿';position:absolute;font-size:180px;right:-16px;bottom:-87px;color:#b3c8ab;opacity:.6}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#71866c;font-weight:700}.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:13px 0}.hero p{font-size:13px;line-height:1.6;max-width:270px;color:#62745f}.heading{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 15px}.heading h2{font-size:26px}.small{color:var(--muted);font-size:12px}.tripgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.trip{background:var(--paper);border-radius:20px;overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;color:inherit}.cover{height:145px;background:linear-gradient(145deg,#c8d8bd,#91b1a1);position:relative;display:flex;align-items:center;justify-content:center;color:white;font-size:44px}.cover img{width:100%;height:100%;object-fit:cover}.tripinfo{padding:13px}.trip h3{font-size:18px;margin:0 0 7px}.trip p{font-size:11px;color:var(--muted);line-height:1.5}.pill{border-radius:100px;padding:7px 12px;background:var(--soft);font-size:11px;display:inline-flex;gap:5px;align-items:center}.trip .pill{margin-top:10px}.addcard{border:2px dashed #b9c8b4;background:#f0f4eb;border-radius:20px;min-height:235px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#70866f}.addcard b{font-size:14px}.plus{font-size:32px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdf8ed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 8px max(12px,env(safe-area-inset-bottom));z-index:5}.bottom button{border:0;background:none;color:var(--muted);font-size:11px;display:grid;gap:3px;justify-items:center}.bottom button span{font-size:21px}.bottom .active{color:#57775d;font-weight:700}.fab{background:#69886d!important;color:white!important;border-radius:50%!important;width:48px;height:48px;margin-top:-25px;font-size:28px!important;box-shadow:0 4px 12px #5d745b40}.detailhero{border-radius:25px;overflow:hidden;background:#d6e3d1;height:220px;display:flex;align-items:center;justify-content:center;font-size:70px;position:relative}.detailhero img{width:100%;height:100%;object-fit:cover}.detailhead{padding:22px 5px 10px}.detailhead h1{font-size:34px;margin:6px 0}.desc{line-height:1.7;color:#687867;font-size:13px;margin-top:12px}.day{margin:22px 0}.daytitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.daytitle h2{font-size:23px}.stop{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px;margin:11px 0}.stophead{display:flex;gap:10px;align-items:center}.number{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:var(--soft);font-size:12px;font-weight:700}.stop h3{font-size:18px}.stop p{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}.photos{display:flex;gap:7px;overflow-x:auto;margin-top:12px}.photos img{height:105px;width:105px;object-fit:cover;border-radius:12px;flex-shrink:0}.photos button{border:1px dashed #b5c5b1;background:#eef3ea;color:#6d886c;border-radius:12px;min-width:100px;height:105px}.btn{border:0;border-radius:14px;background:#6f8d73;color:white;padding:13px 17px;font-weight:700;font-size:13px}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.ghost{background:transparent;color:#9b6d60}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.modalbg{position:fixed;inset:0;background:#283a2e75;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--paper);border-radius:26px 26px 0 0;padding:22px;width:100%;max-width:560px;max-height:91dvh;overflow:auto}.modal h2{font-size:26px;margin:0 0 16px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:13px;background:#f9faf5;border:1px solid #dbe2d6;border-radius:12px;color:var(--ink);outline-color:#8ca88e}.field textarea{min-height:90px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.empty{padding:35px;text-align:center;background:var(--paper);border-radius:20px;color:var(--muted);font-size:13px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#344638;color:white;border-radius:12px;padding:12px 16px;z-index:40;max-width:90%;font-size:12px}.settings{background:var(--paper);padding:22px;border-radius:22px;border:1px solid var(--line)}.settings p{font-size:13px;line-height:1.7;color:var(--muted);margin:10px 0}.tiny{font-size:11px;color:var(--muted)}@media(min-width:650px){.tripgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.cover{height:195px}.bottom{left:50%;transform:translateX(-50%);max-width:480px;border-radius:22px 22px 0 0}.modalbg{align-items:center}.modal{border-radius:26px}.hero{min-height:230px;padding:40px}}
</style></head><body><header><div class="brand">✿ little elsewhere</div><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button></header><main id="app"></main><nav class="bottom"><button id="homeNav" class="active"><span>⌂</span>Trips</button><button id="addNav" class="fab" aria-label="New trip">+</button><button id="aboutNav"><span>♡</span>About</button></nav><div id="overlay"></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=s=>document.querySelector(s), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let client=null,user=null,trips=[],stops=[],photos=[],view='home',selected=null,settings=JSON.parse(localStorage.getItem('le_settings')||'{}');
const uid=()=>crypto.randomUUID();const notify=m=>{let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3300)};
const saveLocal=()=>localStorage.setItem('le_data',JSON.stringify({trips,stops,photos}));
function initLocal(){const d=JSON.parse(localStorage.getItem('le_data')||'null');if(d){trips=d.trips||[];stops=d.stops||[];photos=d.photos||[]}else{const id=uid();trips=[{id,title:'Dieng 3D2N',location:'Dieng, Central Java',start_date:'',end_date:'',description:'A little escape into the clouds, sunrise views, hot springs, and mountain air.',cover_url:'',demo:true}];['Glamping check-in','Sunset at Bukit Scooter','Banyu Mili hot spring','Sunrise at Pintu Langit','Air Terjun Sikarim','Swiss Van Java','Kebun Teh Panama','BBQ at the villa'].forEach((name,i)=>stops.push({id:uid(),trip_id:id,day_number:i<3?1:2,sort_order:i,title:name,notes:''}));saveLocal()}}
function publicURL(path){return client.storage.from('travel-photos').getPublicUrl(path).data.publicUrl}
async function load(){if(client&&user){let [t,s,p]=await Promise.all([client.from('trips').select('*').order('created_at',{ascending:false}),client.from('stops').select('*').order('day_number').order('sort_order'),client.from('stop_photos').select('*').order('created_at')]);for(let x of [t,s,p])if(x.error){notify(x.error.message);return}trips=t.data;stops=s.data;photos=p.data}else initLocal();render()}
async function persist(table,obj){if(client){if(!user)throw Error('Sign in first');let {error}=await client.from(table).upsert({...obj,user_id:user.id});if(error)throw error}else saveLocal()}
async function remove(table,id){if(client){let {error}=await client.from(table).delete().eq('id',id);if(error)throw error}else saveLocal()}
function pic(src,alt=''){return src?`<img src="${escapeHTML(src)}" alt="${escapeHTML(alt)}">`:''}
function render(){let a=$('#app');$('#homeNav').classList.toggle('active',view==='home');$('#aboutNav').classList.toggle('active',view==='about');if(view==='home'){a.innerHTML=`<section class="hero"><div class="eyebrow">Your pocket-sized travel diary</div><h1>Collect little<br>moments, everywhere.</h1><p>A cozy home for the places you've been and the memories you've made. ♡</p></section><div class="heading"><h2>My adventures <span style="font-size:19px">🌿</span></h2><span class="small">${trips.length} trips</span></div><div class="tripgrid">${trips.map(t=>`<button class="trip" data-trip="${t.id}"><div class="cover">${pic(t.cover_url,t.title)||'🏞️'}</div><div class="tripinfo"><h3>${escapeHTML(t.title)}</h3><p>⌁ ${escapeHTML(t.location||'Somewhere lovely')}</p><p>${escapeHTML(t.start_date||'Dates to remember')}</p><span class="pill">✿ View memories</span></div></button>`).join('')}<button class="addcard" id="newCard"><span class="plus">＋</span><b>A new adventure</b><span class="tiny">Tap to start a trip</span></button></div>`;a.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>{selected=b.dataset.trip;view='detail';render()});$('#newCard').onclick=()=>tripForm();return}
if(view==='about'){a.innerHTML=`<div class="hero"><div class="eyebrow">A love letter to wandering</div><h1>Everywhere feels<br>like a story. ♡</h1><p>Keep the ordinary, the extraordinary, and all the in-between moments.</p></div><div class="settings"><h2>About this diary</h2><p>Little Elsewhere is your personal travel scrapbook. Make trips, organize stops by day, and attach photographs to every moment.</p><p>${client?'☁ Cloud mode is configured.':'✿ Demo mode: trips are saved only in this browser until you connect Supabase.'}</p><button class="btn secondary" id="aboutSettings">Settings & cloud sync</button></div>`;$('#aboutSettings').onclick=settingsForm;return}
let t=trips.find(x=>x.id===selected);if(!t){view='home';render();return}let ts=stops.filter(s=>s.trip_id===t.id),days=[...new Set(ts.map(s=>s.day_number))].sort((a,b)=>a-b);a.innerHTML=`<div class="actions"><button class="btn secondary" id="back">← All trips</button><button class="btn secondary" id="editTrip">✎ Edit trip</button></div><div class="detailhero">${pic(t.cover_url,t.title)||'🌲'}</div><div class="detailhead"><div class="eyebrow">✿ Travel memories</div><h1>${escapeHTML(t.title)}</h1><span class="small">⌁ ${escapeHTML(t.location||'Unknown destination')} · ${escapeHTML([t.start_date,t.end_date].filter(Boolean).join(' — '))}</span><p class="desc">${escapeHTML(t.description||'A story worth remembering.')}</p></div><div class="heading"><h2>Our little itinerary</h2><button class="btn" id="addStop">+ Add stop</button></div>${days.length?days.map(day=>`<section class="day"><div class="daytitle"><h2>Day ${day} <span style="font-size:18px">🍃</span></h2><span class="small">${ts.filter(s=>s.day_number===day).length} stops</span></div>${ts.filter(s=>s.day_number===day).sort((a,b)=>a.sort_order-b.sort_order).map((s,i)=>`<div class="stop"><div class="stophead"><span class="number">${i+1}</span><div style="flex:1"><h3>${escapeHTML(s.title)}</h3></div><button class="iconbtn" style="width:32px;height:32px;font-size:15px" data-editstop="${s.id}">✎</button></div>${s.notes?`<p>${escapeHTML(s.notes)}</p>`:''}<div class="photos">${photos.filter(p=>p.stop_id===s.id).map(p=>`<img src="${escapeHTML(p.url)}" alt="${escapeHTML(p.caption||s.title)}" title="${escapeHTML(p.caption||'Tap to manage')}" data-photo="${p.id}">`).join('')}<button data-upload="${s.id}">＋<br>Add photos</button></div></div>`).join('')}</section>`).join(''):`<div class="empty">🍃 No stops yet. Add your first little moment!</div>`}<div class="actions"><button class="btn secondary" id="addAnother">+ Add another stop</button><button class="btn ghost" id="deleteTrip">Delete trip</button></div>`;$('#back').onclick=()=>{view='home';render()};$('#editTrip').onclick=()=>tripForm(t);$('#addStop').onclick=$('#addAnother').onclick=()=>stopForm(null,t.id);$('#deleteTrip').onclick=()=>deleteTrip(t);a.querySelectorAll('[data-editstop]').forEach(b=>b.onclick=()=>stopForm(stops.find(s=>s.id===b.dataset.editstop),t.id));a.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>uploadForm(b.dataset.upload));a.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>photoForm(photos.find(p=>p.id===b.dataset.photo)))}
function modal(title,body,save){$('#overlay').innerHTML=`<div class="modalbg"><div class="modal"><h2>${title}</h2><form id="modalForm">${body}<div class="modalactions"><button class="btn secondary" type="button" id="cancel">Cancel</button><button class="btn" type="submit">Save ♡</button></div></form></div></div>`;$('#cancel').onclick=close;$('.modalbg').onclick=e=>{if(e.target.className==='modalbg')close()};$('#modalForm').onsubmit=async e=>{e.preventDefault();let btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{await save(new FormData(e.target));close();render()}catch(err){notify(err.message)}finally{btn.disabled=false}}}function close(){$('#overlay').innerHTML=''}
const field=(label,name,val='',type='text',required=false)=>`<div class="field"><label>${label}</label>${type==='textarea'?`<textarea name="${name}">${escapeHTML(val)}</textarea>`:`<input name="${name}" type="${type}" value="${escapeHTML(val)}" ${required?'required':''}>`}</div>`;
function tripForm(t){modal(t?'Edit your adventure':'A new adventure 🌱',field('Trip name','title',t?.title||'', 'text',true)+field('Destination','location',t?.location)+field('Start date','start_date',t?.start_date,'date')+field('End date','end_date',t?.end_date,'date')+field('Your little story','description',t?.description,'textarea')+field('Cover image URL (optional)','cover_url',t?.cover_url)+`<div class="field"><label>Or upload a cover photo</label><input type="file" name="cover_file" accept="image/*"></div>`,async f=>{let x={id:t?.id||uid(),title:f.get('title'),location:f.get('location'),start_date:f.get('start_date')||null,end_date:f.get('end_date')||null,description:f.get('description'),cover_url:f.get('cover_url')||''};let file=f.get('cover_file');if(file?.size)x.cover_url=await uploadFile(file);await persist('trips',x);if(t)Object.assign(t,x);else trips.unshift(x);selected=x.id;view='detail';saveLocal()})}
function stopForm(s,trip_id){modal(s?'Edit this stop':'A little stop 🌿',field('Stop name','title',s?.title||'','text',true)+field('Day number','day_number',s?.day_number||1,'number',true)+field('Memories / notes','notes',s?.notes,'textarea'),async f=>{let x={id:s?.id||uid(),trip_id,title:f.get('title'),day_number:Math.max(1,Number(f.get('day_number'))),notes:f.get('notes'),sort_order:s?.sort_order??stops.filter(x=>x.trip_id===trip_id).length};await persist('stops',x);if(s)Object.assign(s,x);else stops.push(x);saveLocal()})}
async function uploadFile(file){if(!client||!user)throw Error('Connect Supabase and sign in to upload photos.');if(!file.type.startsWith('image/'))throw Error('Please choose an image');if(file.size>15*1024*1024)throw Error('Images must be under 15 MB');let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase();let path=`${user.id}/${uid()}.${ext}`;let {error}=await client.storage.from('travel-photos').upload(path,file,{contentType:file.type});if(error)throw error;return publicURL(path)}
function uploadForm(stop_id){modal('Add a memory 📷',`<div class="field"><label>Choose photos (multiple allowed)</label><input name="files" type="file" accept="image/*" multiple required></div>`+field('Caption (optional, shared)','caption'),async f=>{let fs=f.getAll('files').filter(x=>x.size);if(!fs.length)throw Error('Select at least one photo');for(let file of fs){let url=await uploadFile(file),x={id:uid(),stop_id,url,caption:f.get('caption')};await persist('stop_photos',x);photos.push(x)}})}
function photoForm(p){modal('Photo memory ♡',`<div style="text-align:center"><img style="max-width:100%;max-height:45vh;border-radius:15px" src="${escapeHTML(p.url)}"></div>`+field('Caption','caption',p.caption)+`<button type="button" class="btn ghost" id="removePhoto">Delete photo</button>`,async f=>{await persist('stop_photos',{...p,caption:f.get('caption')});p.caption=f.get('caption');saveLocal()});$('#removePhoto').onclick=async()=>{if(!confirm('Delete this photo?'))return;try{await remove('stop_photos',p.id);photos=photos.filter(x=>x.id!==p.id);close();render()}catch(e){notify(e.message)}}}
async function deleteTrip(t){if(!confirm(`Delete ${t.title} and all its stops/photos?`))return;try{await remove('trips',t.id);let ids=stops.filter(s=>s.trip_id===t.id).map(s=>s.id);stops=stops.filter(s=>s.trip_id!==t.id);photos=photos.filter(p=>!ids.includes(p.stop_id));trips=trips.filter(x=>x.id!==t.id);saveLocal();view='home';render()}catch(e){notify(e.message)}}
function settingsForm(){modal('Your cozy corner ⚙',`<p class="small">Enter your Supabase project URL and publishable/anon key. These are stored in this browser. Never enter a service_role key.</p>`+field('Supabase project URL','url',settings.url)+field('Supabase publishable / anon key','key',settings.key)+`<p class="small">Cloud mode requires the SQL setup in README. Use email sign-in to protect your diary.</p>`+field('Email','email',user?.email||'','email')+field('Password','password','','password')+`<div class="actions"><button type="button" class="btn secondary" id="signIn">Sign in</button><button type="button" class="btn secondary" id="signUp">Sign up</button><button type="button" class="btn ghost" id="signOut">Sign out</button></div>`,async f=>{settings={url:f.get('url').trim(),key:f.get('key').trim()};localStorage.setItem('le_settings',JSON.stringify(settings));configure();await load();notify('Settings saved')});for(let mode of ['signIn','signUp'])$('#'+mode).onclick=async()=>{let f=new FormData($('#modalForm'));settings={url:f.get('url').trim(),key:f.get('key').trim()};localStorage.setItem('le_settings',JSON.stringify(settings));configure();if(!client)return notify('Add Supabase credentials first');let method=mode==='signIn'?'signInWithPassword':'signUp',r=await client.auth[method]({email:f.get('email'),password:f.get('password')});if(r.error)return notify(r.error.message);user=r.data.user;close();await load();notify(mode==='signUp'?'Account created. Check your email if confirmation is enabled.':'Welcome back!')};$('#signOut').onclick=async()=>{if(client)await client.auth.signOut();user=null;close();trips=[];stops=[];photos=[];await load();notify('Signed out')}}
function configure(){client=settings.url&&settings.key?createClient(settings.url,settings.key):null}
$('#settingsBtn').onclick=settingsForm;$('#homeNav').onclick=()=>{view='home';render()};$('#aboutNav').onclick=()=>{view='about';render()};$('#addNav').onclick=()=>tripForm();configure();if(client){client.auth.getUser().then(async r=>{user=r.data.user;await load()})}else load();
</script></body></html>
